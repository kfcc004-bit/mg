<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업무 FAQ 검색</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --highlight: #fff3a3;
      --shadow: 0 10px 30px rgba(31, 41, 55, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .app {
      width: min(960px, calc(100% - 32px));
      margin: 48px auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 38px);
      letter-spacing: -0.04em;
    }

    .header p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .search-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .search-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    #searchInput {
      flex: 1;
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #searchInput:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .filter-wrap {
      margin-top: 18px;
    }

    .filter-title {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn,
    .reset-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover,
    .reset-btn:hover {
      border-color: #9ca3af;
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 24px 0 12px;
    }

    .result-count {
      font-weight: 800;
    }

    .result-count span {
      color: var(--primary);
    }

    .reset-btn {
      border-radius: 10px;
      padding: 9px 13px;
    }

    .results {
      display: grid;
      gap: 12px;
    }

    .faq-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      margin-bottom: 10px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 800;
    }

    .question {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .answer {
      margin: 10px 0 0;
      color: #374151;
    }

    .field-label {
      display: inline-block;
      min-width: 44px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      vertical-align: top;
    }

    mark {
      background: var(--highlight);
      color: inherit;
      border-radius: 3px;
      padding: 0 2px;
    }

    .empty {
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
      background: var(--panel);
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
    }

    @media (max-width: 640px) {
      .app {
        width: min(100% - 20px, 960px);
        margin: 24px auto;
      }

      .search-panel,
      .faq-card {
        padding: 16px;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .reset-btn {
        align-self: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>업무 FAQ 검색</h1>
      <p>질문이나 키워드를 입력해 필요한 업무 FAQ를 찾아보세요.</p>
    </header>

    <section class="search-panel" aria-label="FAQ 검색 및 분류">
      <label class="search-label" for="searchInput">검색</label>
      <div class="search-row">
        <input
          id="searchInput"
          type="search"
          placeholder="질문이나 키워드를 입력하세요."
          autocomplete="off"
        />
      </div>

      <div class="filter-wrap">
        <p class="filter-title">분류</p>
        <div class="filters" id="categoryFilters" aria-label="FAQ 분류 필터">
          <button class="filter-btn active" type="button" data-category="전체">전체</button>
          <button class="filter-btn" type="button" data-category="교육">교육</button>
          <button class="filter-btn" type="button" data-category="문서">문서</button>
          <button class="filter-btn" type="button" data-category="IT">IT</button>
          <button class="filter-btn" type="button" data-category="보안">보안</button>
        </div>
      </div>
    </section>

    <section aria-live="polite">
      <div class="toolbar">
        <div class="result-count">검색 결과 <span id="resultCount">0</span>건</div>
        <button class="reset-btn" id="showAllBtn" type="button">전체보기</button>
      </div>
      <div class="results" id="results"></div>
    </section>
  </main>

  <script>
    // 첨부 JSON의 내용만 사용합니다.
    const faqData = [
      {
        category: "교육",
        question: "교육 신청은 어디에서 하나요?",
        answer: "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다."
      },
      {
        category: "교육",
        question: "신청한 교육을 취소하려면 어떻게 하나요?",
        answer: "신청내역에서 취소 가능 여부를 확인합니다."
      },
      {
        category: "문서",
        question: "주간 업무보고에는 무엇을 넣어야 하나요?",
        answer: "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다."
      },
      {
        category: "IT",
        question: "사내 시스템 접속이 되지 않습니다.",
        answer: "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다."
      },
      {
        category: "보안",
        question: "ChatGPT에 내부 업무자료를 넣어도 되나요?",
        answer: "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다."
      }
    ];

    const searchInput = document.getElementById("searchInput");
    const categoryFilters = document.getElementById("categoryFilters");
    const resultCount = document.getElementById("resultCount");
    const results = document.getElementById("results");
    const showAllBtn = document.getElementById("showAllBtn");

    let selectedCategory = "전체";

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlight(text, keyword) {
      const safeText = escapeHtml(text);
      const trimmedKeyword = keyword.trim();

      if (!trimmedKeyword) return safeText;

      const escapedKeyword = escapeRegExp(trimmedKeyword);
      const regex = new RegExp(`(${escapedKeyword})`, "gi");
      return safeText.replace(regex, "<mark>$1</mark>");
    }

    function getFilteredFaqs() {
      const keyword = searchInput.value.trim().toLowerCase();

      return faqData.filter((item) => {
        const categoryMatch =
          selectedCategory === "전체" || item.category === selectedCategory;

        const searchableText = `${item.question} ${item.answer} ${item.category}`.toLowerCase();
        const keywordMatch = !keyword || searchableText.includes(keyword);

        return categoryMatch && keywordMatch;
      });
    }

    function render() {
      const keyword = searchInput.value.trim();
      const filteredFaqs = getFilteredFaqs();

      resultCount.textContent = filteredFaqs.length;

      if (filteredFaqs.length === 0) {
        results.innerHTML = `
          <div class="empty">
            등록된 FAQ에서 답변을 찾을 수 없습니다.<br><br>관련 담당부서 또는 공식 안내자료를 확인해 주세요.
          </div>
        `;
        return;
      }

      results.innerHTML = filteredFaqs
        .map(
          (item) => `
            <article class="faq-card">
              <div class="category-badge">${highlight(item.category, keyword)}</div>
              <h2 class="question">
                <span class="field-label">질문</span>
                ${highlight(item.question, keyword)}
              </h2>
              <p class="answer">
                <span class="field-label">답변</span>
                ${highlight(item.answer, keyword)}
              </p>
            </article>
          `
        )
        .join("");
    }

    searchInput.addEventListener("input", render);

    categoryFilters.addEventListener("click", (event) => {
      const button = event.target.closest(".filter-btn");
      if (!button) return;

      selectedCategory = button.dataset.category;

      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.classList.toggle("active", btn === button);
      });

      render();
    });

    showAllBtn.addEventListener("click", () => {
      searchInput.value = "";
      selectedCategory = "전체";

      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.category === "전체");
      });

      searchInput.focus();
      render();
    });

    render();
  </script>
</body>
</html>
